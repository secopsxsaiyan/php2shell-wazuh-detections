title: PHP memory exhaustion or allocator corruption in web server error log
id: 9adc537f-5a5d-40ad-be1b-e7fccf840bf8
status: experimental
description: >
  A PHP memory bailout or zend allocator corruption recorded in the web
  server error log. This is the defender-visible signal when PHP2Shell is
  driven to exhaust memory rather than to execute. In the tested case the HTTP
  response was 200, so the error log was the only place the event appeared.
references:
  - CVE-2026-109618
  - CVE-2026-109619
author: secopsxsaiyan
date: 2026-11-01
logsource:
  product: apache
  service: error
detection:
  selection:
    - 'Allowed memory size of'
    - 'zend_mm_heap corrupted'
    - 'PHP Fatal error'
  condition: selection
falsepositives:
  - Legitimate large-upload OOM when memory_limit is low.
  - Applications that log PHP fatals as a matter of course.
level: high
tags:
  - attack.impact
  - cve.2026-109618
  - cve.2026-109619
